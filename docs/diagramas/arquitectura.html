<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Arquitectura</title>
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", Arial, sans-serif; }
  .t { font-size: 22px; font-weight: 700; fill: #10233f; }
  .s { font-size: 15px; fill: #44546a; }
  .m { font-family: Consolas, monospace; font-size: 14px; fill: #1f3b63; }
  .lbl { font-family: Consolas, monospace; font-size: 13px; fill: #7a2e0e; }
  .ttl { font-size: 26px; font-weight: 700; fill: #10233f; }
</style></head>
<body>
<svg width="1400" height="980" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3b63"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>

  <text x="700" y="40" text-anchor="middle" class="ttl">Arquitectura de microservicios — Tienda Virtual</text>

  <!-- Usuario -->
  <rect x="560" y="70" width="280" height="70" rx="35" fill="#eef2f7" stroke="#1f3b63" stroke-width="2"/>
  <text x="700" y="102" text-anchor="middle" class="t">USUARIO</text>
  <text x="700" y="125" text-anchor="middle" class="s">Navegador · App móvil · Postman</text>
  <line x1="700" y1="140" x2="700" y2="188" stroke="#1f3b63" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="712" y="170" class="m">HTTP/JSON</text>

  <!-- Red docker -->
  <rect x="30" y="200" width="1340" height="640" rx="18" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="50" y="228" class="s" font-style="italic">Red interna de Docker (docker-compose) — cada servicio en su propio contenedor</text>

  <!-- Gateway -->
  <rect x="400" y="245" width="600" height="95" rx="12" fill="#1f3b63"/>
  <text x="700" y="282" text-anchor="middle" class="t" fill="#fff" style="fill:#fff">API GATEWAY  ·  :8000</text>
  <text x="700" y="310" text-anchor="middle" class="s" style="fill:#dbe4f0">Punto de entrada único · enrutamiento · tablero /api/estado</text>
  <text x="700" y="330" text-anchor="middle" class="s" style="fill:#dbe4f0">(capa "Aplicación cliente")</text>

  <!-- Gateway -> servicios -->
  <path d="M480,340 L200,470" stroke="#1f3b63" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="215" y="410" class="m">/api/productos</text>
  <line x1="700" y1="340" x2="700" y2="470" stroke="#1f3b63" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="712" y="410" class="m">/api/pedidos</text>
  <path d="M920,340 L1200,470" stroke="#1f3b63" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="1080" y="395" class="m">/api/clientes</text>

  <!-- Servicios -->
  <g>
    <rect x="60" y="472" width="280" height="150" rx="12" fill="#e0ecff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="200" y="508" text-anchor="middle" class="t">PRODUCTOS · :8001</text>
    <text x="200" y="536" text-anchor="middle" class="s">Catálogo e inventario</text>
    <text x="200" y="562" text-anchor="middle" class="m">GET · POST · PUT · DELETE</text>
    <text x="200" y="584" text-anchor="middle" class="m">descontar / reponer stock</text>
    <text x="200" y="606" text-anchor="middle" class="s">Sin dependencias</text>
  </g>
  <g>
    <rect x="560" y="472" width="280" height="150" rx="12" fill="#fff4e5" stroke="#c2410c" stroke-width="2.5"/>
    <text x="700" y="508" text-anchor="middle" class="t">PEDIDOS · :8003</text>
    <text x="700" y="536" text-anchor="middle" class="s">Registro y estado de pedidos</text>
    <text x="700" y="562" text-anchor="middle" class="m">POST · GET · PUT estado</text>
    <text x="700" y="584" text-anchor="middle" class="m">timeout · reintentos · saga</text>
    <text x="700" y="606" text-anchor="middle" class="s">Depende de Clientes y Productos</text>
  </g>
  <g>
    <rect x="1060" y="472" width="280" height="150" rx="12" fill="#e7f6ec" stroke="#15803d" stroke-width="2.5"/>
    <text x="1200" y="508" text-anchor="middle" class="t">CLIENTES · :8002</text>
    <text x="1200" y="536" text-anchor="middle" class="s">Registro de clientes</text>
    <text x="1200" y="562" text-anchor="middle" class="m">GET · POST · PUT · DELETE</text>
    <text x="1200" y="584" text-anchor="middle" class="m">correo y documento únicos</text>
    <text x="1200" y="606" text-anchor="middle" class="s">Sin dependencias</text>
  </g>

  <!-- Comunicación entre servicios -->
  <line x1="558" y1="525" x2="344" y2="525" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/>
  <text x="451" y="512" text-anchor="middle" class="lbl">GET /productos/{id}</text>
  <line x1="558" y1="575" x2="344" y2="575" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/>
  <text x="451" y="598" text-anchor="middle" class="lbl">POST …/descontar-stock</text>
  <line x1="842" y1="548" x2="1056" y2="548" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/>
  <text x="949" y="535" text-anchor="middle" class="lbl">GET /clientes/{id}</text>

  <!-- Datos -->
  <g fill="#f8fafc" stroke="#475569" stroke-width="2">
    <path d="M120,690 v70 a80,18 0 0 0 160,0 v-70"/><ellipse cx="200" cy="690" rx="80" ry="18"/>
    <path d="M620,690 v70 a80,18 0 0 0 160,0 v-70"/><ellipse cx="700" cy="690" rx="80" ry="18"/>
    <path d="M1120,690 v70 a80,18 0 0 0 160,0 v-70"/><ellipse cx="1200" cy="690" rx="80" ry="18"/>
  </g>
  <g stroke="#475569" stroke-width="2"><line x1="200" y1="622" x2="200" y2="670"/><line x1="700" y1="622" x2="700" y2="670"/><line x1="1200" y1="622" x2="1200" y2="670"/></g>
  <text x="200" y="738" text-anchor="middle" class="t" style="font-size:18px">Catálogo</text>
  <text x="700" y="738" text-anchor="middle" class="t" style="font-size:18px">Órdenes</text>
  <text x="1200" y="738" text-anchor="middle" class="t" style="font-size:18px">Usuarios</text>
  <text x="700" y="815" text-anchor="middle" class="s">Cada servicio es dueño exclusivo de sus datos (listas en memoria en el taller; base de datos propia en producción)</text>

  <!-- Leyenda -->
  <line x1="300" y1="900" x2="360" y2="900" stroke="#1f3b63" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="372" y="905" class="s">Petición del usuario enrutada por el gateway</text>
  <line x1="780" y1="900" x2="840" y2="900" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/>
  <text x="852" y="905" class="s">Llamada REST entre microservicios</text>
  <text x="700" y="945" text-anchor="middle" class="s">Tolerancia a fallos: timeout 2 s · 3 reintentos · respuesta 503 controlada · compensación de stock · degradación parcial</text>
</svg>
</body></html>
